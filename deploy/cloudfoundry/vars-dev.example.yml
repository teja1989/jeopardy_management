# Copy to deploy/cloudfoundry/vars-dev.yml (gitignored) and replace secrets from Vault/KeyVault
api_instances: 1
api_memory: 768M
jeopardy_api_route: jeopardy-api-dev.apps.internal.example.com
jeopardy_ui_route: jeopardy-dev.apps.example.com
jeopardy_api_url: https://jeopardy-api-dev.apps.internal.example.com

postgres_jdbc_url: jdbc:postgresql://jeopardy-pg-rw.jeopardy-dev.svc.cluster.local:5432/jeopardy
postgres_user: jeopardy
postgres_password: REPLACE_WITH_DEV_PG_PASSWORD

clickhouse_jdbc_url: jdbc:ch://clickhouse-jeopardy.jeopardy-dev.svc.cluster.local:8123/jeopardy
clickhouse_http_url: http://clickhouse-jeopardy.jeopardy-dev.svc.cluster.local:8123
clickhouse_user: jeopardy
clickhouse_password: REPLACE_WITH_DEV_CH_PASSWORD

kafka_bootstrap_servers: kafka-dev-1.example.internal:9092,kafka-dev-2.example.internal:9092

auth_provider: local
admin_username: admin
admin_password: REPLACE_WITH_DEV_ADMIN_PASSWORD
auth_jwt_secret: REPLACE_WITH_32_BYTE_DEV_SIGNING_SECRET
auth_cookie_secure: "false"
azure_ad_tenant_id: ""
azure_ad_client_id: ""
azure_ad_admin_role: Jeopardy.Admin
