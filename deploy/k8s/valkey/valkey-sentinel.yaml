# =============================================================================
# Valkey 8 OSS (BSD-3) — 3-Node Sentinel HA Cache for BPMN Process Registry
# =============================================================================
# 100% Open-Source Linux Foundation Valkey 8 (BSD-3 license).
# Production cold-restart protection for Flowable `parentProcessInstanceId`
# lookups (Guardrail #1): serves 100k+ sub-ms reads/sec when Flink TaskManagers
# restart with an empty local Caffeine LRU cache, keeping PostgreSQL untouched.
# Graceful degradation: if Valkey is unreachable, Flink Stage 2 falls back
# transparently to PostgreSQL `bpmn_process_registry`.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-sentinel-config
  namespace: jeopardy
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: jeopardy-management
data:
  valkey.conf: |
    port 6379
    bind 0.0.0.0
    protected-mode yes
    maxmemory 1536mb
    maxmemory-policy allkeys-lru
    appendonly no
    save ""
    tcp-keepalive 60
    timeout 0
  init-valkey.sh: |
    #!/bin/sh
    set -eu
    cp /etc/valkey-template/valkey.conf /etc/valkey/valkey.conf
    echo "requirepass ${VALKEY_PASSWORD}" >> /etc/valkey/valkey.conf
    echo "masterauth ${VALKEY_PASSWORD}" >> /etc/valkey/valkey.conf
    if [ "$(hostname)" != "valkey-0" ]; then
      echo "replicaof valkey-0.valkey-headless.jeopardy.svc.cluster.local 6379" >> /etc/valkey/valkey.conf
    fi
    cat <<EOF > /etc/valkey/sentinel.conf
    port 26379
    bind 0.0.0.0
    dir /tmp
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor jeopardy-bpmn-cache valkey-0.valkey-headless.jeopardy.svc.cluster.local 6379 2
    sentinel auth-pass jeopardy-bpmn-cache ${VALKEY_PASSWORD}
    sentinel down-after-milliseconds jeopardy-bpmn-cache 5000
    sentinel failover-timeout jeopardy-bpmn-cache 15000
    sentinel parallel-syncs jeopardy-bpmn-cache 1
    EOF
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: jeopardy
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: jeopardy-management
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
    - name: sentinel
      port: 26379
      targetPort: 26379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: jeopardy
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: jeopardy-management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: jeopardy
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: jeopardy-management
spec:
  serviceName: valkey-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: jeopardy-management
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: valkey
                topologyKey: topology.kubernetes.io/zone
      initContainers:
        - name: init-config
          image: valkey/valkey:8-alpine
          command: ["/bin/sh", "/etc/valkey-template/init-valkey.sh"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jeopardy-valkey-auth
                  key: password
          volumeMounts:
            - name: config-template
              mountPath: /etc/valkey-template
            - name: runtime-config
              mountPath: /etc/valkey
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jeopardy-valkey-auth
                  key: password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/valkey
        - name: sentinel
          image: valkey/valkey:8-alpine
          imagePullPolicy: IfNotPresent
          command: ["valkey-sentinel", "/etc/valkey/sentinel.conf"]
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -p 26379 ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: runtime-config
              mountPath: /etc/valkey
      volumes:
        - name: config-template
          configMap:
            name: valkey-sentinel-config
            defaultMode: 0755
        - name: runtime-config
          emptyDir: {}
