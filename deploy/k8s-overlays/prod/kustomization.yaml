apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# =============================================================================
# PRODUCTION Environment Overlay — Full Multi-AZ HA & Autoscaling
# Usage: kubectl apply -k deploy/k8s-overlays/prod
# =============================================================================
namespace: jeopardy-prod

resources:
  - ../../k8s

labels:
  - pairs:
      environment: prod

patches:
  - target:
      kind: Namespace
      name: jeopardy
    patch: |-
      - op: replace
        path: /metadata/name
        value: jeopardy-prod
