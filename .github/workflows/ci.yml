name: CI — Build & Verify Jeopardy Management Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    name: Spring Boot 3 API (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jeopardy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests & package
        run: mvn -B test

  flink-tests:
    name: Apache Flink 1.20 Engine (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jeopardy-flink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Flink unit tests
        run: mvn -B test

  ui-build:
    name: React 18 + TypeScript UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jeopardy-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/jeopardy-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & production build
        run: npx tsc --noEmit && npm run build

  ml-tests:
    name: Python ML & ONNX Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/jeopardy-ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies & run pytest
        run: |
          pip install -r requirements.txt
          pytest -q
