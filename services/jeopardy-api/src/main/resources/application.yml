server:
  port: ${PORT:8080}
  http2:
    enabled: true

spring:
  application:
    name: jeopardy-api
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true
    listener:
      auto-startup: ${JEOPARDY_KAFKA_LISTENER_ENABLED:true}

jeopardy:
  instance-id: ${CF_INSTANCE_GUID:${HOSTNAME:local-dev}}
  auth:
    enabled: ${JEOPARDY_AUTH_ENABLED:true}
    provider: ${JEOPARDY_AUTH_PROVIDER:local} # local | azure-ad
    admin-username: ${JEOPARDY_ADMIN_USERNAME:admin}
    admin-password: ${JEOPARDY_ADMIN_PASSWORD:admin123}
    jwt-secret: ${JEOPARDY_AUTH_SECRET:jeopardy-local-dev-signing-secret-change-in-prod-32bytes}
    session-ttl-hours: ${JEOPARDY_AUTH_SESSION_HOURS:12}
    cookie-secure: ${JEOPARDY_AUTH_COOKIE_SECURE:false}
    azure-ad:
      tenant-id: ${AZURE_AD_TENANT_ID:}
      client-id: ${AZURE_AD_CLIENT_ID:}
      admin-role: ${AZURE_AD_ADMIN_ROLE:Jeopardy.Admin}
      operator-role: ${AZURE_AD_OPERATOR_ROLE:Jeopardy.Operator}
  ai:
    provider: ${JEOPARDY_AI_PROVIDER:azure-openai}
    timeout-seconds: ${JEOPARDY_AI_TIMEOUT_SECONDS:25}
    azure-openai:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      api-key: ${AZURE_OPENAI_API_KEY:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:}
      api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
  ui:
    base-url: ${JEOPARDY_UI_BASE_URL:http://localhost:3000}
  alerts:
    enabled: ${JEOPARDY_ALERTS_ENABLED:true}
    http-timeout-seconds: ${JEOPARDY_ALERTS_TIMEOUT_SECONDS:10}
  incidents:
    enabled: ${JEOPARDY_INCIDENTS_ENABLED:true}
    poll-interval-ms: ${JEOPARDY_INCIDENTS_POLL_MS:30000}
    min-impacted-entities: ${JEOPARDY_INCIDENTS_MIN_ENTITIES:3}
    spike-multiplier: ${JEOPARDY_INCIDENTS_SPIKE_MULTIPLIER:2.0}
    resolve-quiet-minutes: ${JEOPARDY_INCIDENTS_RESOLVE_MINUTES:10}
  topics:
    config-updates: ${JEOPARDY_TOPIC_CONFIG_UPDATES:jeopardy.config.updates}
    ui-updates: ${JEOPARDY_TOPIC_UI_UPDATES:jeopardy.ui.updates}
    alerts-out: ${JEOPARDY_TOPIC_ALERTS_OUT:jeopardy.alerts.out}
  sse:
    heartbeat-interval-ms: 25000
    timeout-ms: 0
  datasources:
    postgres:
      url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/jeopardy}
      username: ${POSTGRES_USER:jeopardy}
      password: ${POSTGRES_PASSWORD:jeopardy}
      maximum-pool-size: ${POSTGRES_POOL_SIZE:15}
    clickhouse:
      url: ${CLICKHOUSE_JDBC_URL:jdbc:ch://localhost:8123/jeopardy}
      http-url: ${CLICKHOUSE_HTTP_URL:http://localhost:8123}
      database: ${CLICKHOUSE_DB:jeopardy}
      username: ${CLICKHOUSE_USER:jeopardy}
      password: ${CLICKHOUSE_PASSWORD:jeopardy}
      maximum-pool-size: ${CLICKHOUSE_POOL_SIZE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
