<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#0f172a"/>
  <text x="32" y="40" fill="#f8fafc" font-size="21" font-weight="700">End-to-End Runtime Data &amp; Event Flow (Hot Signal Path + Cold Audit Path)</text>
  <text x="32" y="62" fill="#94a3b8" font-size="13">Shows unpartitioned AWS MSK ingestion, 1-to-N Fan-Out, Flowable Parent-Chain &amp; Fallout Correlation, SLA Timers, CQRS Stores &amp; ML Feedback</text>

  <!-- ==================== TOP ROW: HOT SIGNAL PIPELINE ==================== -->
  <!-- MSK Box -->
  <rect x="28" y="96" width="188" height="196" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="122" y="122" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">AWS MSK (Kafka)</text>
  <text x="122" y="140" fill="#94a3b8" font-size="11" text-anchor="middle">Unpartitioned Topics</text>
  <rect x="40" y="152" width="164" height="24" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="122" y="168" fill="#e2e8f0" font-size="11" text-anchor="middle">flowable.activity.events</text>
  <rect x="40" y="182" width="164" height="24" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="122" y="198" fill="#c084fc" font-size="11" text-anchor="middle">flowable.fallout.events</text>
  <rect x="40" y="212" width="164" height="24" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="122" y="228" fill="#e2e8f0" font-size="11" text-anchor="middle">domain.order / fulfill / bill</text>
  <rect x="40" y="242" width="164" height="24" rx="5" fill="#0f172a" stroke="#22c55e"/>
  <text x="122" y="258" fill="#4ade80" font-size="11" text-anchor="middle">jeopardy.config.updates</text>

  <!-- Flink Outer Container -->
  <rect x="248" y="88" width="600" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="266" y="112" fill="#38bdf8" font-size="13" font-weight="700">APACHE FLINK (JAVA 21 · ROCKSDB + S3 INCREMENTAL CHECKPOINTS)</text>

  <!-- Stage 1 -->
  <rect x="264" y="128" width="174" height="170" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="351" y="150" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Stage 1: Event Adapter</text>
  <text x="351" y="170" fill="#e2e8f0" font-size="11" text-anchor="middle">O(1) Topic/Type Pre-Filter</text>
  <text x="351" y="188" fill="#4ade80" font-size="11" text-anchor="middle">Drops 95% BPMN Noise</text>
  <text x="351" y="208" fill="#e2e8f0" font-size="11" text-anchor="middle">1-to-N FlatMap (forEach)</text>
  <text x="351" y="224" fill="#94a3b8" font-size="10" text-anchor="middle">Order + N Items + Trade-In</text>
  <text x="351" y="244" fill="#e2e8f0" font-size="11" text-anchor="middle">Compiled JsonPath AST</text>
  <text x="351" y="262" fill="#fbbf24" font-size="10" text-anchor="middle">Masks PII (redactPaths)</text>
  <text x="351" y="282" fill="#f87171" font-size="10" text-anchor="middle">Bad JSON -&gt; Parse DLQ</text>

  <!-- Stage 2 -->
  <rect x="462" y="128" width="174" height="170" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.3"/>
  <text x="549" y="150" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">Stage 2: BPMN Correlator</text>
  <text x="549" y="170" fill="#e2e8f0" font-size="11" text-anchor="middle">processDefKey Rules</text>
  <text x="549" y="186" fill="#94a3b8" font-size="10" text-anchor="middle">Trade-In key vs orderId link</text>
  <text x="549" y="206" fill="#e2e8f0" font-size="11" text-anchor="middle">AsyncDataStream +</text>
  <text x="549" y="222" fill="#e2e8f0" font-size="11" text-anchor="middle">Caffeine LRU (99.5% hit)</text>
  <text x="549" y="240" fill="#94a3b8" font-size="10" text-anchor="middle">Walks parentProcessInstanceId</text>
  <text x="549" y="258" fill="#c084fc" font-size="10" text-anchor="middle">Stitches Fallout BPMN Overlay</text>
  <text x="549" y="278" fill="#f87171" font-size="10" text-anchor="middle">15s OOO Buffer -&gt; Uncorr DLQ</text>

  <!-- Stage 3 -->
  <rect x="660" y="128" width="174" height="170" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.3"/>
  <text x="747" y="150" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Stage 3: Milestone Engine</text>
  <text x="747" y="170" fill="#e2e8f0" font-size="11" text-anchor="middle">keyBy(entityKey)</text>
  <text x="747" y="186" fill="#94a3b8" font-size="10" text-anchor="middle">Order / Item / TradeIn / Chg</text>
  <text x="747" y="206" fill="#e2e8f0" font-size="11" text-anchor="middle">Pinned Blueprint Version</text>
  <text x="747" y="224" fill="#e2e8f0" font-size="11" text-anchor="middle">Processing-Time SLA Timers</text>
  <text x="747" y="240" fill="#94a3b8" font-size="10" text-anchor="middle">Event-Time Duration Math</text>
  <text x="747" y="258" fill="#fbbf24" font-size="10" text-anchor="middle">In-Process ONNX (&lt;1ms ETA)</text>
  <text x="747" y="278" fill="#38bdf8" font-size="10" text-anchor="middle">Cross-Order Pause/Resume</text>

  <!-- BroadcastState Bar inside Flink -->
  <rect x="264" y="316" width="570" height="76" rx="8" fill="#172554" stroke="#22c55e" stroke-dasharray="5 3"/>
  <text x="549" y="340" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Flink BroadcastState Control Plane (Zero-Downtime Hot Reload)</text>
  <text x="549" y="360" fill="#e2e8f0" font-size="11" text-anchor="middle">Receives compiled Adapters, Reusable Templates, Order-Type Blueprints &amp; ONNX Model URIs from jeopardy.config.updates</text>
  <text x="549" y="378" fill="#94a3b8" font-size="11" text-anchor="middle">Recompiles JsonPath ASTs once on config change · Pins version on new entities so in-flight orders never break</text>

  <!-- Right Column: Operational Stores & Outputs -->
  <rect x="884" y="88" width="288" height="170" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.6"/>
  <text x="1028" y="114" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL 16 OSS (CNPG)</text>
  <text x="1028" y="134" fill="#e2e8f0" font-size="11" text-anchor="middle">Micro-batched, Key-Sorted Upserts (200ms)</text>
  <text x="1028" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">• tracked_entities &amp; entity_relationships</text>
  <text x="1028" y="172" fill="#94a3b8" font-size="11" text-anchor="middle">• entity_milestones &amp; entity_fallouts</text>
  <text x="1028" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">• jeopardy_cases (Partial Index &lt;5ms)</text>
  <text x="1028" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">• bpmn_process_registry + Config Tables</text>
  <text x="1028" y="228" fill="#64748b" font-size="10" text-anchor="middle">Monthly Range Partitioned (90d Hot Drop)</text>
  <text x="1028" y="244" fill="#38bdf8" font-size="10" text-anchor="middle">DR Safety: Rehydrates 60d Flink Timers &lt;60s</text>

  <rect x="884" y="274" width="288" height="134" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="1028" y="300" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">Valkey / Redis &amp; Alert Topics</text>
  <text x="1028" y="320" fill="#e2e8f0" font-size="11" text-anchor="middle">• Valkey: Cold-Restart Proof BPMN Lookup</text>
  <text x="1028" y="338" fill="#f87171" font-size="11" text-anchor="middle">• jeopardy.alerts.out (PagerDuty/Ops/SMS)</text>
  <text x="1028" y="356" fill="#38bdf8" font-size="11" text-anchor="middle">• jeopardy.cross-order.signals (Pause/Resume)</text>
  <text x="1028" y="374" fill="#fbbf24" font-size="11" text-anchor="middle">• jeopardy.dlq.* (Parse + Uncorrelated)</text>
  <text x="1028" y="394" fill="#64748b" font-size="10" text-anchor="middle">Zero silent drops under any failure mode</text>

  <!-- ==================== BOTTOM ROW: CLICKHOUSE, APPS & ML ==================== -->
  <!-- ClickHouse Wide Box -->
  <rect x="28" y="456" width="524" height="156" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="290" y="482" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">ClickHouse OSS + Keeper (Altinity K8s Operator)</text>
  <rect x="44" y="496" width="238" height="100" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="163" y="516" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">raw_events (1,000 / Order)</text>
  <text x="163" y="534" fill="#94a3b8" font-size="11" text-anchor="middle">Direct Kafka Batch Sink (5-10s)</text>
  <text x="163" y="550" fill="#94a3b8" font-size="11" text-anchor="middle">Decoupled from Flink upgrades</text>
  <text x="163" y="566" fill="#94a3b8" font-size="11" text-anchor="middle">Powers Level-4 UI Event Log</text>
  <text x="163" y="582" fill="#fbbf24" font-size="10" text-anchor="middle">10x ZSTD Compressed + S3 TTL</text>

  <rect x="298" y="496" width="238" height="100" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="417" y="516" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Real-Time Materialized Views</text>
  <text x="417" y="534" fill="#4ade80" font-size="11" text-anchor="middle">mv_exec_summary_hourly (&lt;30ms)</text>
  <text x="417" y="550" fill="#f87171" font-size="11" text-anchor="middle">mv_devops_bottlenecks_5m</text>
  <text x="417" y="566" fill="#94a3b8" font-size="11" text-anchor="middle">Map(String,String) Dynamic Slicing</text>
  <text x="417" y="582" fill="#38bdf8" font-size="10" text-anchor="middle">60+ Order Types × Account Types</text>

  <!-- Spring Boot & UI -->
  <rect x="584" y="456" width="290" height="156" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="729" y="482" fill="#60a5fa" font-size="14" font-weight="700" text-anchor="middle">Spring Boot 3 API &amp; 3-Persona UI</text>
  <text x="729" y="504" fill="#e2e8f0" font-size="11" text-anchor="middle">1. Exec &amp; DevOps Dashboards (PG Live + CH Trends)</text>
  <text x="729" y="524" fill="#e2e8f0" font-size="11" text-anchor="middle">2. Care Tracker (Journey Tree + Fallout Overlay)</text>
  <text x="729" y="544" fill="#e2e8f0" font-size="11" text-anchor="middle">3. Admin Config Studio (Nested JSON Search)</text>
  <text x="729" y="564" fill="#94a3b8" font-size="11" text-anchor="middle">4. Zero-ETL BI (Apache Superset / Grafana OSS)</text>
  <text x="729" y="586" fill="#4ade80" font-size="11" text-anchor="middle">Publishes Compiled Configs -&gt; Kafka</text>

  <!-- Python ML Box -->
  <rect x="904" y="456" width="268" height="156" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.6"/>
  <text x="1038" y="482" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">Python ML &amp; SLA Calibration</text>
  <text x="1038" y="504" fill="#e2e8f0" font-size="11" text-anchor="middle">Reads Clean History from ClickHouse</text>
  <text x="1038" y="524" fill="#94a3b8" font-size="11" text-anchor="middle">• Filters Outage Windows (No Drift)</text>
  <text x="1038" y="544" fill="#94a3b8" font-size="11" text-anchor="middle">• Trains XGBoost AFT / LightGBM</text>
  <text x="1038" y="564" fill="#94a3b8" font-size="11" text-anchor="middle">• Proposes Tier-2 SLA Baselines</text>
  <text x="1038" y="586" fill="#4ade80" font-size="11" text-anchor="middle">Exports .onnx -&gt; Flink BroadcastState</text>

  <!-- ==================== FLOW ARROWS ==================== -->
  <!-- MSK to Stage 1 -->
  <line x1="216" y1="195" x2="262" y2="195" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <!-- MSK Config to BroadcastState -->
  <path d="M 216 254 L 232 254 L 232 354 L 262 354" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#aGreen)"/>
  <!-- MSK Direct Raw Audit Path to ClickHouse -->
  <path d="M 122 292 L 122 454" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#aAmber)"/>
  <text x="130" y="388" fill="#fbbf24" font-size="11" font-weight="600">Direct Raw Batch Sink</text>
  <text x="130" y="403" fill="#94a3b8" font-size="10">(All 1,000 events/order)</text>

  <!-- Stage 1 -> Stage 2 -> Stage 3 -->
  <line x1="438" y1="212" x2="460" y2="212" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#aBlue)"/>
  <line x1="636" y1="212" x2="658" y2="212" stroke="#c084fc" stroke-width="2.2" marker-end="url(#aPurple)"/>

  <!-- Stage 3 -> PostgreSQL -->
  <line x1="834" y1="172" x2="882" y2="172" stroke="#4ade80" stroke-width="2.2" marker-end="url(#aGreen)"/>
  <!-- Stage 3 -> Alerts/Valkey -->
  <path d="M 834 252 L 858 252 L 858 338 L 882 338" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#aPurple)"/>
  <!-- Stage 3 -> ClickHouse MVs -->
  <path d="M 747 298 L 747 430 L 417 430 L 417 454" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="430" y="445" fill="#fbbf24" font-size="10">Milestone &amp; Fallout Telemetry</text>

  <!-- ClickHouse -> Spring Boot -->
  <line x1="552" y1="534" x2="582" y2="534" stroke="#60a5fa" stroke-width="2" marker-end="url(#aBlue)"/>
  <!-- Postgres -> Spring Boot -->
  <path d="M 884 238 L 866 238 L 866 436 L 729 436 L 729 454" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aGreen)"/>
  <!-- ClickHouse -> ML -->
  <path d="M 417 612 L 417 648 L 1038 648 L 1038 614" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="645" y="641" fill="#c084fc" font-size="11">Historical Completed + Right-Censored Milestone Data</text>

  <!-- Footer Legend -->
  <rect x="28" y="668" width="1144" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <circle cx="52" cy="685" r="5" fill="#38bdf8"/><text x="64" y="689" fill="#cbd5e1" font-size="11">Hot Event Stream</text>
  <circle cx="195" cy="685" r="5" fill="#4ade80"/><text x="207" y="689" fill="#cbd5e1" font-size="11">Operational State &amp; Config Hot-Reload</text>
  <circle cx="450" cy="685" r="5" fill="#fbbf24"/><text x="462" y="689" fill="#cbd5e1" font-size="11">Raw Audit &amp; Historical Analytics</text>
  <circle cx="675" cy="685" r="5" fill="#c084fc"/><text x="687" y="689" fill="#cbd5e1" font-size="11">Flowable/Fallout Correlation &amp; ML Loop</text>
  <circle cx="945" cy="685" r="5" fill="#f87171"/><text x="957" y="689" fill="#cbd5e1" font-size="11">DLQs &amp; Jeopardy Alerts</text>
</svg>
