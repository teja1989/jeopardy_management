<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="660" rx="16" fill="#0f172a"/>

  <!-- Header -->
  <text x="32" y="42" fill="#f8fafc" font-size="22" font-weight="700">Jeopardy Management &amp; Predictive SLA Tracker — High-Level Block Diagram</text>
  <text x="32" y="65" fill="#94a3b8" font-size="13">4-Layer Open-Source Architecture · 40k Orders/Day (200k Peak) · 60+ Order Types · Local Docker Compose to AWS Prod</text>

  <!-- ==================== COLUMN 1: EVENT SOURCES & KAFKA ==================== -->
  <rect x="28" y="92" width="240" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="92" width="240" height="36" rx="12" fill="#1d4ed8"/>
  <rect x="28" y="114" width="240" height="14" fill="#1d4ed8"/>
  <text x="148" y="116" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1. EVENT SOURCES &amp; KAFKA</text>

  <rect x="44" y="146" width="208" height="68" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="148" y="170" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Flowable BPMN Engine</text>
  <text x="148" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">Parent, Item Sub-BPMNs &amp;</text>
  <text x="148" y="203" fill="#c084fc" font-size="11" text-anchor="middle">Fallout Management BPMN</text>

  <rect x="44" y="228" width="208" height="68" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="148" y="252" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Order &amp; Domain Services</text>
  <text x="148" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">60+ Order Types, Fraud, Payment,</text>
  <text x="148" y="285" fill="#94a3b8" font-size="11" text-anchor="middle">Fulfillment, Activation, Trade-In</text>

  <rect x="44" y="316" width="208" height="122" rx="10" fill="#172554" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="148" y="344" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">AWS MSK / Apache Kafka</text>
  <text x="148" y="366" fill="#e2e8f0" font-size="11" text-anchor="middle">Unpartitioned Source Topics</text>
  <text x="148" y="384" fill="#94a3b8" font-size="11" text-anchor="middle">~1,000 raw events / order</text>
  <text x="148" y="405" fill="#4ade80" font-size="11" text-anchor="middle">+ jeopardy.config.updates</text>
  <text x="148" y="422" fill="#f59e0b" font-size="11" text-anchor="middle">+ DLQ &amp; Cross-Order Signals</text>

  <rect x="44" y="456" width="208" height="78" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="148" y="480" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">Key Design Property</text>
  <text x="148" y="499" fill="#94a3b8" font-size="11" text-anchor="middle">Zero breaking changes needed</text>
  <text x="148" y="515" fill="#94a3b8" font-size="11" text-anchor="middle">on existing producer topics</text>

  <!-- ==================== COLUMN 2: STREAM ENGINE (FLINK) ==================== -->
  <rect x="308" y="92" width="272" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="308" y="92" width="272" height="36" rx="12" fill="#0369a1"/>
  <rect x="308" y="114" width="272" height="14" fill="#0369a1"/>
  <text x="444" y="116" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2. REAL-TIME ENGINE (APACHE FLINK)</text>

  <rect x="326" y="146" width="236" height="84" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="444" y="168" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Stage 1: 1-to-N Config Adapters</text>
  <text x="444" y="186" fill="#e2e8f0" font-size="11" text-anchor="middle">Pre-Compiled JsonPath ASTs</text>
  <text x="444" y="202" fill="#94a3b8" font-size="11" text-anchor="middle">Fans out Order + N Items + Trade-In</text>
  <text x="444" y="218" fill="#4ade80" font-size="11" text-anchor="middle">Drops 95% BPMN noise &amp; masks PII</text>

  <rect x="326" y="248" width="236" height="84" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.4"/>
  <text x="444" y="270" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">Stage 2: Flowable &amp; Fallout Correlator</text>
  <text x="444" y="288" fill="#e2e8f0" font-size="11" text-anchor="middle">Walks parentProcessInstanceId</text>
  <text x="444" y="304" fill="#94a3b8" font-size="11" text-anchor="middle">Async Caffeine LRU + Single-Flight</text>
  <text x="444" y="320" fill="#94a3b8" font-size="11" text-anchor="middle">15s Out-of-Order Buffer + DLQ</text>

  <rect x="326" y="350" width="236" height="104" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.4"/>
  <text x="444" y="372" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">Stage 3: Milestone &amp; Jeopardy Engine</text>
  <text x="444" y="390" fill="#e2e8f0" font-size="11" text-anchor="middle">keyBy(entityKey) in RocksDB State</text>
  <text x="444" y="406" fill="#94a3b8" font-size="11" text-anchor="middle">Version-Pinned Blueprint DAGs</text>
  <text x="444" y="422" fill="#94a3b8" font-size="11" text-anchor="middle">Durable SLA Timers (5m to 60d)</text>
  <text x="444" y="438" fill="#f59e0b" font-size="11" text-anchor="middle">Embedded ONNX Runtime (&lt;1ms ETA)</text>

  <rect x="326" y="470" width="236" height="64" rx="8" fill="#172554" stroke="#38bdf8" stroke-dasharray="4 3"/>
  <text x="444" y="494" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">BroadcastState Hot-Reload</text>
  <text x="444" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">Config &amp; ONNX model updates &lt;1s</text>

  <!-- ==================== COLUMN 3: DATA STORES ==================== -->
  <rect x="620" y="92" width="254" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="620" y="92" width="254" height="36" rx="12" fill="#15803d"/>
  <rect x="620" y="114" width="254" height="14" fill="#15803d"/>
  <text x="747" y="116" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3. STORAGE LAYER (2 CORE DBs)</text>

  <rect x="638" y="146" width="218" height="140" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.6"/>
  <text x="747" y="170" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL 16 OSS (CNPG)</text>
  <text x="747" y="190" fill="#e2e8f0" font-size="11" text-anchor="middle">Hot Operational State (90d)</text>
  <text x="747" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">• Entity Tree &amp; Order Links</text>
  <text x="747" y="224" fill="#94a3b8" font-size="11" text-anchor="middle">• Live Milestones &amp; Fallouts</text>
  <text x="747" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">• Exact Live Open Jeopardy Index</text>
  <text x="747" y="256" fill="#94a3b8" font-size="11" text-anchor="middle">• Reusable Config Library</text>
  <text x="747" y="274" fill="#64748b" font-size="10" text-anchor="middle">Monthly Partitioned + Read Replica</text>

  <rect x="638" y="302" width="218" height="142" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="747" y="326" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">ClickHouse OSS (K8s)</text>
  <text x="747" y="346" fill="#e2e8f0" font-size="11" text-anchor="middle">Analytics, Audit &amp; ML Data</text>
  <text x="747" y="364" fill="#94a3b8" font-size="11" text-anchor="middle">• All 1,000 Raw Events / Order</text>
  <text x="747" y="380" fill="#94a3b8" font-size="11" text-anchor="middle">• Exec &amp; DevOps MVs (&lt;30ms)</text>
  <text x="747" y="396" fill="#94a3b8" font-size="11" text-anchor="middle">• Map(String,String) Slicing</text>
  <text x="747" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">• Historical ML Training Sets</text>
  <text x="747" y="430" fill="#64748b" font-size="10" text-anchor="middle">Auto-Tiered to AWS S3 Parquet</text>

  <rect x="638" y="460" width="218" height="74" rx="8" fill="#0f172a" stroke="#a855f7" stroke-dasharray="4 3"/>
  <text x="747" y="484" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">Valkey / Redis (Prod Cache)</text>
  <text x="747" y="502" fill="#94a3b8" font-size="11" text-anchor="middle">Fast BPMN Process Registry</text>
  <text x="747" y="518" fill="#64748b" font-size="10" text-anchor="middle">Optional locally (PG handles dev)</text>

  <!-- ==================== COLUMN 4: APPS, BI & ML ==================== -->
  <rect x="914" y="92" width="258" height="460" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="914" y="92" width="258" height="36" rx="12" fill="#6d28d9"/>
  <rect x="914" y="114" width="258" height="14" fill="#6d28d9"/>
  <text x="1043" y="116" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">4. APPS, REPORTING &amp; ML</text>

  <rect x="932" y="146" width="222" height="114" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="1043" y="169" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">Spring Boot 3 API &amp; UI</text>
  <text x="1043" y="188" fill="#e2e8f0" font-size="11" text-anchor="middle">• Executive &amp; DevOps Dashboards</text>
  <text x="1043" y="204" fill="#e2e8f0" font-size="11" text-anchor="middle">• Customer &amp; Order/Fallout Tracker</text>
  <text x="1043" y="220" fill="#e2e8f0" font-size="11" text-anchor="middle">• Admin Config Studio (JSON Search)</text>
  <text x="1043" y="236" fill="#94a3b8" font-size="11" text-anchor="middle">• CSV / Parquet Report Exports</text>
  <text x="1043" y="252" fill="#4ade80" font-size="10" text-anchor="middle">Java 21 · REST / GraphQL · React</text>

  <rect x="932" y="278" width="222" height="92" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="1043" y="301" fill="#fbbf24" font-size="13" font-weight="700" text-anchor="middle">Zero-ETL BI &amp; Reporting</text>
  <text x="1043" y="320" fill="#e2e8f0" font-size="11" text-anchor="middle">Apache Superset · Grafana OSS</text>
  <text x="1043" y="338" fill="#94a3b8" font-size="11" text-anchor="middle">Direct SQL/JDBC to ClickHouse</text>
  <text x="1043" y="356" fill="#94a3b8" font-size="11" text-anchor="middle">60+ Order Types × Account Types</text>

  <rect x="932" y="388" width="222" height="146" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.4"/>
  <text x="1043" y="411" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">Python ML &amp; SLA Learner</text>
  <text x="1043" y="430" fill="#e2e8f0" font-size="11" text-anchor="middle">Offline Scheduled Training</text>
  <text x="1043" y="448" fill="#94a3b8" font-size="11" text-anchor="middle">• XGBoost AFT / LightGBM</text>
  <text x="1043" y="464" fill="#94a3b8" font-size="11" text-anchor="middle">• Right-Censored 60d Trade-Ins</text>
  <text x="1043" y="480" fill="#94a3b8" font-size="11" text-anchor="middle">• Governed SLA Calibration</text>
  <text x="1043" y="498" fill="#4ade80" font-size="11" text-anchor="middle">Exports .onnx Model -&gt; Flink</text>
  <text x="1043" y="518" fill="#64748b" font-size="10" text-anchor="middle">Bounded by Tier-1 Hard Min/Max</text>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Producers to Kafka -->
  <line x1="148" y1="214" x2="148" y2="226" stroke="#64748b" stroke-width="1.5"/>
  <line x1="148" y1="296" x2="148" y2="314" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Kafka to Flink Stage 1 -->
  <path d="M 252 355 C 282 355, 282 188, 324 188" fill="none" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Flink internal stages -->
  <line x1="444" y1="230" x2="444" y2="246" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="444" y1="332" x2="444" y2="348" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Flink Stage 2 to Valkey/PG -->
  <path d="M 562 290 C 600 290, 595 496, 636 496" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowPurple)"/>

  <!-- Flink Stage 3 to Postgres & ClickHouse -->
  <path d="M 562 385 C 598 385, 598 216, 636 216" fill="none" stroke="#4ade80" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <path d="M 562 415 C 598 415, 598 370, 636 370" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Postgres & ClickHouse to Spring Boot / BI / ML -->
  <line x1="856" y1="205" x2="930" y2="205" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 856 340 C 892 340, 892 225, 930 225" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="856" y1="355" x2="930" y2="325" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 856 400 C 892 400, 892 440, 930 440" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Feedback Loop Footer (Config & ONNX Hot-Reload + Raw Audit Path) -->
  <rect x="28" y="576" width="1144" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="50" y="601" fill="#4ade80" font-size="12" font-weight="700">Control &amp; Audit Loops:</text>
  <text x="206" y="601" fill="#e2e8f0" font-size="12">1) Admin Config Studio &amp; Python ML publish YAML/ONNX to Kafka -&gt; Flink BroadcastState hot-reloads in &lt;1s.</text>
  <text x="206" y="621" fill="#94a3b8" font-size="12">2) Raw Audit Sink streams all 1,000 raw events/order from Kafka directly to ClickHouse (decoupled from Flink upgrades).</text>
</svg>
